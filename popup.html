<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Tab Graveyard</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0f14;
        --panel: #121821;
        --panel-2: #18202b;
        --text: #eef3f8;
        --muted: #8fa0b3;
        --accent: #f97316;
        --accent-2: #22c55e;
        --border: #243244;
      }
      body {
        margin: 0;
        width: 340px;
        min-height: 280px;
        background: radial-gradient(circle at top, #172133 0, var(--bg) 60%);
        color: var(--text);
        font: 14px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        padding: 18px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 18px;
      }
      .card {
        background: linear-gradient(180deg, var(--panel), var(--panel-2));
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 14px;
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.24);
      }
      .count {
        font-size: 38px;
        font-weight: 800;
        letter-spacing: -0.03em;
        margin: 6px 0 2px;
      }
      .label {
        color: var(--muted);
      }
      button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        margin-top: 14px;
        padding: 12px 14px;
        border: 0;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--accent), #fb7185);
        color: #fff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover {
        filter: brightness(1.05);
      }
      .footer {
        margin-top: 10px;
        color: var(--muted);
        font-size: 12px;
      }
      .toolbar {
        display: flex;
        gap: 8px;
        margin-top: 10px;
      }
      .toolbar button {
        width: auto;
        margin-top: 0;
        padding: 8px 10px;
        border-radius: 10px;
        background: #243244;
        font-weight: 700;
      }
      .filter {
        width: 100%;
        margin-top: 10px;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: rgba(9, 13, 19, 0.7);
        color: var(--text);
        font: inherit;
      }
      .status {
        margin-top: 8px;
        min-height: 18px;
        color: var(--accent-2);
        font-size: 12px;
      }
      .list {
        display: grid;
        gap: 10px;
        margin-top: 12px;
        max-height: 220px;
        overflow: auto;
      }
      .row {
        display: grid;
        gap: 6px;
        padding: 10px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: rgba(12, 17, 25, 0.5);
      }
      .row-title {
        font-weight: 700;
        line-height: 1.25;
      }
      .row-meta {
        color: var(--muted);
        font-size: 12px;
        word-break: break-word;
      }
      .row button {
        width: fit-content;
        margin-top: 2px;
        padding: 8px 10px;
        border-radius: 10px;
        background: #243244;
        font-weight: 700;
      }
      .empty {
        color: var(--muted);
        font-size: 13px;
        padding: 10px 0 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Tab Graveyard</h1>
      <section class="card">
        <div class="label">Buried tabs</div>
        <div id="count" class="count">0</div>
        <div class="label">Tabs that were inactive for more than 4 hours.</div>
        <input id="filter" class="filter" type="search" placeholder="Filter by domain" />
        <div class="toolbar">
          <button id="import" type="button">Import Graveyard</button>
          <button id="exhume" type="button">Exhume Graveyard</button>
        </div>
        <input id="import-file" type="file" accept=".md,text/markdown,text/plain" hidden />
        <div id="list" class="list" aria-live="polite"></div>
        <div id="status" class="status" aria-live="polite"></div>
      </section>
      <div class="footer">Exports a Markdown archive and clears local extension storage.</div>
    </main>
    <script src="shared.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
